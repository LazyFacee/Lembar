<head>

<style>
:root{--bg:#fff;--soft:#F5F5F7;--surface:#fff;--ink:#17171C;--muted:#707078;--line:#E9E9EE;--line2:#D9D9E0;--ok:#16A34A;--on:#fff;--hdr:rgba(255,255,255,.82);--t1:5%;--t2:16%;--t3:8%;--ease:cubic-bezier(.22,1,.36,1);
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'DM Sans','Segoe UI',system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1014;--soft:#1A1D24;--surface:#14171C;--ink:#F2F2F5;--muted:#9A9AA5;--line:#262A33;--line2:#3A3F4B;--ok:#34D399;--hdr:rgba(14,16,20,.82);--t1:12%;--t2:32%;--t3:16%;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1014;--soft:#1A1D24;--surface:#14171C;--ink:#F2F2F5;--muted:#9A9AA5;--line:#262A33;--line2:#3A3F4B;--ok:#34D399;--hdr:rgba(14,16,20,.82);--t1:12%;--t2:32%;--t3:16%;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.55 var(--body);background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
header .in{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:700 22px var(--display);letter-spacing:-.02em;background:none;border:0}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:17px;height:17px;stroke:var(--bg)}
.right{display:flex;gap:10px;align-items:center}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;display:flex;gap:8px;align-items:center}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:5px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);transition:.3s var(--ease)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.lang button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.lang.seg button{padding:6px 10px}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:center;padding:30px 0 26px}
h1{font:700 clamp(36px,5.6vw,62px)/1.02 var(--display);letter-spacing:-.04em;max-width:11em}
.hero p{color:var(--muted);margin-top:18px;max-width:32em;font-size:18px}
.hdrop{position:relative;border:2px dashed var(--line2);border-radius:28px;background:var(--soft);padding:26px 20px 24px;text-align:center;transition:.35s var(--ease);display:block;width:100%}
.hdrop:hover,.hdrop.over{border-color:var(--ink);background:var(--surface);transform:translateY(-3px)}
.stack{position:relative;height:150px;margin-bottom:8px}
.sheet{position:absolute;inset:0;margin:auto;width:104px;height:140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:0 16px 34px -20px rgba(0,0,0,.3);transition:transform .5s var(--ease)}
.sheet u{display:block;height:6px;border-radius:4px;background:var(--line)}
.sheet u:nth-child(2){width:78%}.sheet u:nth-child(3){width:58%}
.sheet.a{transform:translateX(-52px) rotate(-9deg)}.sheet.b{transform:translateX(52px) rotate(8deg)}.sheet.c{z-index:2}
.hdrop:hover .a{transform:translateX(-64px) rotate(-12deg)}.hdrop:hover .b{transform:translateX(64px) rotate(11deg)}
.sheet.c em{margin-top:auto;gap:6px;white-space:nowrap;font:600 11px var(--body);font-style:normal;color:var(--ok);display:flex;justify-content:space-between}
.sheet.c .br{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.sheet.c .br s{display:block;height:100%;width:36%;background:var(--ok);border-radius:4px;animation:shrink 1.8s .5s both var(--ease)}
@keyframes shrink{from{width:100%}}
.hdrop strong{display:block;font:700 21px var(--display);letter-spacing:-.01em}
.hdrop span{color:var(--muted);font-size:14px}
.pend{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.pend b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend button{background:color-mix(in srgb,var(--bg) 22%,transparent);border:0;color:var(--bg);border-radius:9px;padding:5px 12px}
/* grid */
.bar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 16px;border-radius:99px;font-weight:500;font-size:14px;transition:background .3s,color .3s,border-color .3s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:var(--soft);min-width:210px;transition:.3s var(--ease)}
#q:focus{background:var(--surface);border-color:var(--ink);outline:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-flow:dense;padding-bottom:64px}
.card{--c:var(--ink);position:relative;overflow:hidden;text-align:left;background:color-mix(in srgb,var(--c) var(--t1),var(--bg));border:1px solid color-mix(in srgb,var(--c) var(--t2),var(--bg));border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:164px;transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease),opacity .3s}
.card.big{grid-column:span 2;min-height:190px;padding:24px}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 18px 32px -22px var(--c)}
.card.dim{opacity:.35}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);transition:transform .45s var(--ease)}
.card:hover .ico{transform:scale(1.08) rotate(-4deg)}
.ico svg{width:23px;height:23px;stroke:var(--on);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card h3{font:700 18px var(--display);letter-spacing:-.015em}
.card.big h3{font-size:24px}
.card p{color:var(--muted);font-size:14px;line-height:1.45;max-width:26em}
.deco{position:absolute;right:-14px;bottom:-14px;width:120px;height:120px;stroke:var(--c);fill:none;stroke-width:1.2;opacity:.12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.card.big .deco{width:170px;height:170px}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
/* tool */
.back{background:none;border:0;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:8px 0;margin-bottom:6px}
.back:hover{color:var(--ink)}
.thead{display:flex;gap:18px;align-items:center;background:color-mix(in srgb,var(--c) var(--t3),var(--bg));border:1px solid color-mix(in srgb,var(--c) var(--t2),var(--bg));border-radius:26px;padding:22px 26px;margin-bottom:16px}
.thead .ico{width:58px;height:58px;border-radius:18px}.thead .ico svg{width:28px;height:28px}
.thead h2{font:700 32px var(--display);letter-spacing:-.03em;line-height:1.1}
.thead p{color:var(--muted);font-size:15px;margin-top:2px}
.ws{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start;padding-bottom:64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.opts{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.opts h4{font:700 17px var(--display)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:52px 20px;text-align:center;transition:.3s var(--ease);display:block;width:100%;background:none}
.drop:hover,.drop.over{border-color:var(--c);background:color-mix(in srgb,var(--c) var(--t1),var(--bg))}
.drop strong{display:block;font:700 20px var(--display);margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.files{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.files li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;animation:enter .35s var(--ease) both}
.th{width:40px;height:52px;border-radius:7px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center}
.th img{max-width:100%;max-height:100%}
.files .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.files small{color:var(--muted)}
.ib{border:0;background:none;width:30px;height:30px;border-radius:9px;color:var(--muted);transition:.2s}
.ib:hover{background:var(--soft);color:var(--ink)}.ib:disabled{opacity:.3;cursor:default}
.add{margin-top:10px;background:none;border:0;color:var(--c);font-weight:600;padding:6px 0}
label,.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);transition:.25s}
input:focus,select:focus{background:var(--surface);border-color:var(--c);outline:0}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:3px}
input[type=range]{accent-color:var(--c)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{width:100%;aspect-ratio:2.8;border:1px dashed #cfcfd6;border-radius:12px;background:#fff linear-gradient(#E4E4EA,#E4E4EA) no-repeat 5% 74%/90% 1px;touch-action:none;cursor:crosshair}
.padtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.padtools .sp{flex:1}
.inks{display:flex;gap:7px}.inkb{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line2);padding:0}.inkb[aria-pressed=true]{outline:2px solid var(--ink)}
.sl{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}.sl input{flex:1;min-width:0}.sl span{min-width:5.5em}
.mini{align-self:flex-start;background:var(--soft);border:0;border-radius:9px;padding:5px 12px;font-size:13px}
.go{background:var(--c);color:var(--on);border:0;border-radius:14px;padding:14px;font:600 16px var(--body);transition:transform .25s var(--ease),filter .25s,opacity .25s}
.go:not(:disabled):hover{filter:brightness(1.07);transform:translateY(-1px)}.go:not(:disabled):active{transform:scale(.98)}
.go:disabled{opacity:.4;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px}
/* studio */
.stool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.pg{border:1px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);transition:.25s var(--ease)}
.pg.over{outline:2px dashed var(--c)}
.pv{height:140px;background:var(--soft);border-radius:9px;display:grid;place-items:center;overflow:hidden}
.pv img{max-width:100%;max-height:100%;transition:transform .4s var(--ease)}
.pg.del .pv{opacity:.25}.pg.del{border-color:#E5484D}
.pc{display:flex;align-items:center;gap:2px;margin-top:5px;font-size:12px;color:var(--muted)}
.pc span{flex:1;font-weight:600;padding-left:4px}
.pc button{border:0;background:none;width:24px;height:24px;border-radius:7px;font-size:13px}
.pc button:hover{background:var(--soft);color:var(--ink)}
/* result */
/* result + preview */
.res{animation:enter .5s var(--ease) both}
.rtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.res .ok{width:48px;height:48px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,var(--bg));display:grid;place-items:center;animation:pop .6s .1s var(--ease) both}
.res .ok svg{width:24px;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rtx{flex:1;min-width:200px}
.res h3{font:700 24px var(--display);letter-spacing:-.02em;line-height:1.2}
.res p{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.cmp{max-width:420px;margin:18px 0 0;font-size:14px}
.pvh{font:700 15px var(--display);margin:22px 0 10px}
.pvbox{background:var(--soft);border-radius:16px;padding:10px;min-height:110px}
.vbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}.vbar .sp{flex:1}.vbar span{font-size:13px;color:var(--muted);min-width:46px;text-align:center}
.vscroll{overflow:auto;max-height:68vh;text-align:center;border-radius:10px}
.vc{display:inline-block;background:#fff;box-shadow:0 8px 24px -12px rgba(0,0,0,.35);max-width:none;vertical-align:top}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ptabs .mini[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pimg{max-width:100%;max-height:68vh;display:block;margin:0 auto;border-radius:8px}
.ptxt{white-space:pre-wrap;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:50vh;overflow:auto;padding:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.pgrid img{width:100%;border-radius:8px;background:#fff}
.cmp div{display:flex;justify-content:space-between;margin-bottom:5px}
.cmp .t{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px}
.cmp .t s{display:block;height:100%;border-radius:6px;background:var(--muted)}.cmp .t.n s{background:var(--ok)}
.dl{background:var(--c);color:var(--on);border:0;font-size:16px;font-weight:600;padding:14px 28px;border-radius:14px}
.again{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);font-weight:500}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .35s,transform .45s var(--ease);max-width:90vw;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#home,#tool{animation:enter .55s var(--ease) both}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.ws{grid-template-columns:1fr}.opts{position:static}.pill{display:none}}
@media(max-width:520px){.wrap{padding:0 16px}.thead{padding:16px}.thead h2{font-size:25px}#q{width:100%}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="in">
    <button class="logo" onclick="goHome()" aria-label="Lembar"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/></svg></i>Lembar</button>
    <div class="right"><span class="pill"><b></b><span data-id="Diproses di browser, file tidak diunggah" data-en="Runs in your browser, nothing is uploaded"></span></span>
    <div class="lang" role="group" aria-label="Theme" id="themeseg"><button data-th="system" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg></button><button data-th="light" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-th="dark" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button></div>
    <div class="lang" role="group" aria-label="Language"><button data-l="id" aria-pressed="true">ID</button><button data-l="en" aria-pressed="false">EN</button></div></div>
  </div></header>

  <main id="home">
    <section class="hero">
      <div>
        <h1 data-id="Semua urusan PDF, selesai di perangkatmu." data-en="Every PDF job, done on your own device."></h1>
        <p data-id="17 alat untuk menggabung, menandatangani, menyensor, dan mengedit PDF. Tanpa akun, tanpa instal, tanpa unggah ke server." data-en="17 tools to merge, sign, redact and edit PDFs. No account, no install, no upload to any server."></p>
      </div>
      <button class="hdrop" id="hdrop" type="button">
        <div class="stack" aria-hidden="true"><div class="sheet a"><u></u><u></u><u></u></div><div class="sheet b"><u></u><u></u><u></u></div>
        <div class="sheet c"><u></u><u></u><u></u><em><span data-id="Kecil" data-en="Smaller"></span><span>−64%</span></em><div class="br"><s></s></div></div></div>
        <strong data-id="Seret PDF ke sini" data-en="Drop a PDF here"></strong>
        <span data-id="lalu pilih alatnya, atau klik untuk memilih file" data-en="then pick a tool, or click to choose a file"></span>
      </button>
      <input type="file" id="hpick" hidden multiple accept="application/pdf,image/*">
    </section>
    <div id="pend" class="pend hide"></div>
    <div class="bar"><div class="chips" id="chips"></div>
      <input id="q" type="search" autocomplete="off" data-ph-id="Cari alat…  ( / )" data-ph-en="Search tools…  ( / )"></div>
    <div class="grid" id="grid"></div>
  </main>

  <main id="tool" class="hide"></main>
  <footer data-id="Lembar · File diproses di perangkatmu dan tidak pernah diunggah ke server." data-en="Lembar · Your files are processed on your device and never uploaded to a server."></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<!--LIBS-->
<script>
const {PDFDocument,StandardFonts,rgb,degrees,PDFName}=PDFLib;
if(window['pdfjs-dist/build/pdf.worker'])window.pdfjsWorker=window['pdfjs-dist/build/pdf.worker'];
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.js';

/* ---------- bahasa / language ---------- */
let lang='id';
try{lang=localStorage.getItem('lembar_lang')||((navigator.language||'').startsWith('id')?'id':'en')}catch(e){lang=(navigator.language||'').startsWith('id')?'id':'en'}
const L=x=>Array.isArray(x)?x[lang=='id'?0:1]:x;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),4500)}

function parsePages(spec,n){
  spec=(spec||'').trim();if(!spec)return[...Array(n).keys()];
  const out=[];
  for(const part of spec.split(/[,\s]+/).filter(Boolean)){
    const m=part.match(/^(\d*)-(\d*)$/);
    if(m&&(m[1]||m[2])){const a=+(m[1]||1),b=+(m[2]||n);if(a<=b)for(let i=a;i<=b;i++)out.push(i);else for(let i=a;i>=b;i--)out.push(i)}

  return out.map(p=>p-1);
}

async function putText(doc,page,text,fs,color,pos,margin=36){
  const font=await doc.embedFont(StandardFonts.Helvetica),{width:w,height:h}=page.getSize(),lines=text.split('\n'),lh=fs*1.25;
  lines.forEach((line,i)=>{

async function pageCanvas(page,scale,gray){
  const vp=page.getViewport({scale}),c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
  const x=c.getContext('2d',{willReadFrequently:!!gray});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;

let STUDIO=[];
const ENGINE={
async merge(files){
  if(files.length<2)E('Pilih minimal 2 file PDF untuk digabung.','Choose at least 2 PDF files to merge.');
  const out=await PDFDocument.create();
  for(const f of files){const s=await load(f);(await out.copyPages(s,s.getPageIndices())).forEach(p=>out.addPage(p))}
  return{blob:await save(out),name:stem(files[0])+'-merged.pdf'};
},
async split(files,o){
  const src=await load(files[0]),n=src.getPageCount(),base=stem(files[0]);let groups;
  if(o.mode=='each')groups=[...Array(n).keys()].map(i=>[i]);
  else{
    if(!(o.ranges||'').trim())E('Isi rentang halaman, misalnya 1-3, 5, 7-9.','Enter page ranges, e.g. 1-3, 5, 7-9.');
    groups=o.ranges.split(',').filter(s=>s.trim()).map(s=>parsePages(s,n));
  }
  const items=[];
  for(const[k,g]of groups.entries())items.push([`${base}-part-${k+1}.pdf`,await save(await pick(src,g))]);
  return items.length==1?{blob:items[0][1],name:items[0][0]}:{blob:await zip(items),name:base+'-split.zip'};
},
async studio(files){
  const keep=STUDIO.filter(p=>!p.del);if(!keep.length)E('Sisakan minimal satu halaman.','Keep at least one page.');
  const src=await load(files[0]),out=await PDFDocument.create(),pages=await out.copyPages(src,keep.map(p=>p.i));
  pages.forEach((pg,k)=>{pg.setRotation(degrees(((pg.getRotation().angle+keep[k].rot)%360+360)%360));out.addPage(pg)});
  return{blob:await save(out),name:stem(files[0])+'-studio.pdf'};
},
async rotate(files,o){
  const d=await load(files[0]);
  parsePages(o.pages,d.getPageCount()).forEach(i=>{const p=d.getPage(i);p.setRotation(degrees((p.getRotation().angle+ +o.angle)%360))});
  return{blob:await save(d),name:stem(files[0])+'-rotated.pdf'};
},
async crop(files,o){
  const d=await load(files[0]),mm=2.834645,[t,r,b,l]=['top','right','bottom','left'].map(k=>Math.max(0,+o[k]||0)*mm);
  if(!(t+r+b+l))E('Isi margin yang mau dipotong (dalam mm).','Enter the margins to trim (in mm).');
  for(const i of parsePages(o.pages,d.getPageCount())){
    const p=d.getPage(i),{x,y,width,height}=p.getCropBox(),nw=width-l-r,nh=height-t-b;
    if(nw<10||nh<10)E('Potongan terlalu besar, halaman akan hilang.','That crop is too large, the page would vanish.');
    p.setCropBox(x+l,y+b,nw,nh);
  }
  return{blob:await save(d),name:stem(files[0])+'-cropped.pdf'};
},
async nup(files,o){
  const src=await load(files[0]),n=+o.per||2,[cols,rows,land]={2:[2,1,1],4:[2,2,0],6:[3,2,1]}[n];
  let W=595.28,H=841.89;if(land)[W,H]=[H,W];
  const out=await PDFDocument.create(),emb=await out.embedPages(src.getPages()),m=24,g=10,cw=(W-2*m-g*(cols-1))/cols,ch=(H-2*m-g*(rows-1))/rows;

    for(let k=0;k<n&&s+k<emb.length;k++){
      const e=emb[s+k],sc=Math.min(cw/e.width,ch/e.height),w=e.width*sc,h=e.height*sc,c=k%cols,r=Math.floor(k/cols);
      const x=m+c*(cw+g)+(cw-w)/2,y=H-m-r*(ch+g)-ch+(ch-h)/2;
      pg.drawPage(e,{x,y,width:w,height:h});pg.drawRectangle({x,y,width:w,height:h,borderColor:rgb(.85,.85,.88),borderWidth:.5});

          const r=vp.convertToViewportRectangle([x0,f-it.height*.25,x1,f+it.height*.95]);
          x.fillRect(Math.min(r[0],r[2])-2,Math.min(r[1],r[3])-2,Math.abs(r[2]-r[0])+4,Math.abs(r[3]-r[1])+4);
          i=low.indexOf(w,i+w.length);
        }
      }
    }
    pages.push({blob:await toBlob(c,'image/jpeg',.9),w:c.width/scale,h:c.height/scale});await tick();
  }
  if(!hits)E('Kata tidak ditemukan di dokumen ini. Cek ejaan, atau dokumen mungkin hasil scan.','No matches found. Check the spelling, or the document may be a scan.');
  return{blob:await save(await imagesToPdf(pages)),name:stem(files[0])+'-redacted.pdf',note:[`${hits} bagian disensor. Halaman kini berupa gambar, jadi teks di bawah blok hitam tidak bisa dipulihkan.`,`${hits} match(es) redacted. Pages are now images, so the text under the bars cannot be recovered.`]};

async edit(files,o){

async watermark(files,o){
  const text=(o.text||'').trim();if(!text)E('Tulis teks watermark.','Enter the watermark text.');
  const d=await load(files[0]),font=await d.embedFont(StandardFonts.HelveticaBold),fs=+o.size||64,r=Math.PI/4;
  let tl;try{tl=font.widthOfTextAtSize(text,fs)}catch(e){E('Teks hanya mendukung huruf Latin.','Text supports Latin letters only.')}
  for(const p of d.getPages()){const{width:w,height:h}=p.getSize();
    p.drawText(text,{x:w/2-Math.cos(r)*tl/2,y:h/2-Math.sin(r)*tl/2-fs*.3,size:fs,font,color:rgb(.45,.45,.5),opacity:+o.opacity||.25,rotate:degrees(45)})}

async pagenum(files,o){

async meta(files,o){

    if(o.title)d.setTitle(o.title);if(o.author)d.setAuthor(o.author);if(o.subject)d.setSubject(o.subject);
    if(o.keywords)d.setKeywords(o.keywords.split(',').map(s=>s.trim()).filter(Boolean));
  }else{d.setTitle('');d.setAuthor('');d.setSubject('');d.setKeywords([]);d.setProducer('');d.setCreator('');d.catalog.delete(PDFName.of('Metadata'))}
  return{blob:await save(d),name:stem(files[0])+(o.mode=='edit'?'-meta.pdf':'-clean.pdf'),note:o.mode=='edit'?null:['Judul, penulis, subjek, kata kunci, dan data XMP sudah dihapus.','Title, author, subject, keywords and XMP data were removed.']};
},
async img2pdf(files,o){
  const out=await PDFDocument.create();
  for(const f of files){
    let img;
    try{
      if(f.type=='image/jpeg')img=await out.embedJpg(await f.arrayBuffer());
      else if(f.type=='image/png')img=await out.embedPng(await f.arrayBuffer());
      else{const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);img=await out.embedPng(await(await toBlob(c,'image/png')).arrayBuffer())}
    }catch(e){E(`${f.name} bukan gambar yang bisa dibaca (pakai JPG, PNG, atau WebP).`,`${f.name} is not a readable image (use JPG, PNG or WebP).`)}
    if(o.fit=='a4'){
      const W=595.28,H=841.89,m=24,s=Math.min((W-2*m)/img.width,(H-2*m)/img.height),w=img.width*s,h=img.height*s;
      out.addPage([W,H]).drawImage(img,{x:(W-w)/2,y:(H-h)/2,width:w,height:h});
    }else out.addPage([img.width,img.height]).drawImage(img,{x:0,y:0,width:img.width,height:img.height});
  }
  return{blob:await save(out),name:'images.pdf'};
},
async pdf2img(files,o){
  const f=files[0],base=stem(f),png=o.format=='png',n=(await load(f)).getPageCount(),idx=parsePages(o.pages,n);
  const imgs=await raster(f,+o.dpi||150,.9,idx,{type:png?'image/png':'image/jpeg'}),ext=png?'png':'jpg';
  if(imgs.length==1)return{blob:imgs[0].blob,name:`${base}-${idx[0]+1}.${ext}`};
  return{blob:await zip(imgs.map((x,k)=>[`${base}-${idx[k]+1}.${ext}`,x.blob])),name:base+'-images.zip'};
},
async pdf2txt(files){
  const pdf=await openJs(files[0]),out=[];
  for(let p=1;p<=pdf.numPages;p++){
    progress(p,pdf.numPages);let s='';
    for(const it of(await(await pdf.getPage(p)).getTextContent()).items)s+=it.str+(it.hasEOL?'\n':'');
    out.push(s.trim());
  }
  if(!out.some(Boolean))E('Tidak ada teks di PDF ini. Mungkin file hasil scan.','No text found in this PDF. It may be a scan.');
  const txt=out.map((s,i)=>`--- ${L(['Halaman','Page'])} ${i+1} ---\n${s}`).join('\n\n');
  return{blob:new Blob([txt],{type:'text/plain;charset=utf-8'}),name:stem(files[0])+'.txt'};
}
};

const PADS={strokes:[],smooth:65,thick:10,ink:'#17171C'};
function initPad(){
  const c=$('#pad');if(!c)return;const x=c.getContext('2d');
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const setup=()=>{x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle=PADS.ink};
  const line=(a,b,w)=>{x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()};
  const quad=(a,k,b,w)=>{x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.quadraticCurveTo(k.x,k.y,b.x,b.y);x.stroke()};
  function paint(p){ // gambar satu goresan utuh dengan kurva halus
    setup();
    if(p.length==1){x.beginPath();x.arc(p[0].x,p[0].y,p[0].w/2,0,7);x.fill();return}
    line(p[0],mid(p[0],p[1]),p[0].w);
    for(let i=1;i<p.length-1;i++)quad(mid(p[i-1],p[i]),p[i],mid(p[i],p[i+1]),p[i].w);
    const n=p.length;line(mid(p[n-2],p[n-1]),p[n-1],p[n-1].w);
  }
  const sync=()=>{$('#o_sig').value=PADS.strokes.length?c.toDataURL('image/png'):'';updGo()};
  const redraw=()=>{x.clearRect(0,0,c.width,c.height);PADS.strokes.forEach(paint);sync()};
  let cur=null,b=null,last=null,lw=0;
  const pt=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
  function follow(p){ // stabilizer: kuas "tertarik" pelan ke pointer, jitter tangan teredam
    const k=1-PADS.smooth/100*.92,nb={x:b.x+(p.x-b.x)*k,y:b.y+(p.y-b.y)*k},d=Math.hypot(nb.x-b.x,nb.y-b.y);
    if(d<1.5)return;
    const sp=Math.min(d/(PADS.thick*3.2),1);lw=lw*.8+PADS.thick*(1.2-.7*sp)*.2; // cepat = tipis, pelan = tebal
    b=nb;cur.push({x:b.x,y:b.y,w:lw});const n=cur.length;setup();
    if(n==2)line(cur[0],mid(cur[0],cur[1]),cur[0].w);
    else if(n>2)quad(mid(cur[n-3],cur[n-2]),cur[n-2],mid(cur[n-2],cur[n-1]),cur[n-2].w);
  }
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);last=pt(e);b={...last};lw=PADS.thick*.9;cur=[{x:b.x,y:b.y,w:lw}]};
  c.onpointermove=e=>{if(!cur)return;for(const ev of(e.getCoalescedEvents?.()||[e])){last=pt(ev);follow(last)}};
  c.onpointerup=c.onpointercancel=()=>{
    if(!cur)return;for(let i=0;i<16;i++)follow(last);
    if(cur.length==1)paint(cur);else{const n=cur.length;setup();line(mid(cur[n-2],cur[n-1]),cur[n-1],cur[n-1].w)}
    PADS.strokes.push(cur);cur=null;sync();
  };
  $('#padclear').onclick=()=>{PADS.strokes=[];redraw()};
  $('#padundo').onclick=()=>{PADS.strokes.pop();redraw()};
  const sm=$('#padsmooth'),th=$('#padthick');sm.value=PADS.smooth;th.value=PADS.thick;
  sm.oninput=()=>PADS.smooth=+sm.value;th.oninput=()=>PADS.thick=+th.value;
  document.querySelectorAll('.inkb').forEach(k=>{k.setAttribute('aria-pressed',k.dataset.ink==PADS.ink);k.onclick=()=>{PADS.ink=k.dataset.ink;document.querySelectorAll('.inkb').forEach(o=>o.setAttribute('aria-pressed',o===k));redraw()}});
  redraw();
}

function studioRender(){
  const g=$('#sgrid');if(!g)return;
  g.innerHTML=STUDIO.map((p,k)=>`<div class="pg${p.del?' del':''}" draggable="true" data-k="${k}" data-pid="${p.id}"><div class="pv"><img alt="" ${p.src?`src="${p.src}"`:''} style="transform:rotate(${p.rot}deg)${p.rot%180?' scale(.7)':''}"></div><div class="pc"><span>${k+1}</span><button data-a="l" aria-label="Left">←</button><button data-a="r" aria-label="Right">→</button><button data-a="rot" aria-label="Rotate">⟳</button><button data-a="del" aria-label="Delete">✕</button></div></div>`).join('');
  updGo();
}
const smove=(a,b)=>{if(b<0||b>=STUDIO.length)return;const[x]=STUDIO.splice(a,1);STUDIO.splice(b,0,x);studioRender()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'),s=e.target.closest('[data-s]');
  if(b&&tool?.id=='studio'){const k=+b.closest('.pg').dataset.k,p=STUDIO[k],a=b.dataset.a;
    if(a=='l')smove(k,k-1);else if(a=='r')smove(k,k+1);else if(a=='rot'){p.rot=(p.rot+90)%360;studioRender()}else{p.del=!p.del;studioRender()}}
  if(s){const a=s.dataset.s;if(a=='rot')STUDIO.forEach(p=>p.rot=(p.rot+90)%360);else if(a=='rev')STUDIO.reverse();else if(a=='reset'){STUDIO.sort((x,y)=>x.i-y.i);STUDIO.forEach(p=>{p.rot=0;p.del=false})}else{files=[];STUDIO=[];renderBody();return}studioRender()}
});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.pg');if(c){dragK=+c.dataset.k;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','p')}});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.pg');if(c&&dragK>=0){e.preventDefault();document.querySelectorAll('.pg.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.pg');if(c&&dragK>=0){e.stopPropagation();smove(dragK,+c.dataset.k)}dragK=-1},true);
document.addEventListener('dragend',()=>{dragK=-1;document.querySelectorAll('.pg.over').forEach(x=>x.classList.remove('over'))});

/* proses & hasil */
async function run(){
  const go=$('#go');if(go.disabled)return;const label=go.textContent;
  go.disabled=true;go.innerHTML='<span class="spin"></span>'+L(['Memproses…','Processing…']);
  progress=(i,n)=>{go.innerHTML=`<span class="spin"></span>${L(['Memproses','Processing'])} ${i}/${n}`};
  try{await tick();const r=await ENGINE[tool.id](files,collect());showResult(r)}
  catch(e){console.error(e);toast(e.p?L(e.p):(e.message||L(['Gagal memproses file.','Could not process the file.'])))}
  progress=()=>{};go.textContent=label;updGo();
}
function showResult(r){res={...r,before:files.reduce((s,f)=>s+f.size,0)};renderBody()}
async function pdfViewer(box,blob){
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise,n=pdf.numPages;let p=1,z=1,busy=false,again=false;
  box.innerHTML=`<div class="vbar"><button class="mini" data-v="-1" aria-label="Prev">←</button><span class="vnum"></span><button class="mini" data-v="1" aria-label="Next">→</button><span class="sp"></span><button class="mini" data-z="-1" aria-label="Zoom out">−</button><span class="vz"></span><button class="mini" data-z="1" aria-label="Zoom in">+</button></div><div class="vscroll"><canvas class="vc"></canvas></div>`;
  const cv=box.querySelector('canvas'),sc=box.querySelector('.vscroll');
  async function draw(){
    if(busy){again=true;return}busy=true;
    do{again=false;
      const page=await pdf.getPage(p),base=page.getViewport({scale:1}),w=Math.max(120,(sc.clientWidth-4)*z),vp=page.getViewport({scale:w/base.width*Math.min(devicePixelRatio||1,2)});
      cv.width=vp.width;cv.height=vp.height;cv.style.width=w+'px';
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);await page.render({canvasContext:x,viewport:vp}).promise;
    }while(again);
    busy=false;box.querySelector('.vnum').textContent=`${p} / ${n}`;box.querySelector('.vz').textContent=Math.round(z*100)+'%';
  }
  box.onclick=e=>{const v=e.target.closest('[data-v]'),zz=e.target.closest('[data-z]');
    if(v){p=Math.min(n,Math.max(1,p+ +v.dataset.v));sc.scrollTop=0;draw()}
    if(zz){z=Math.min(3,Math.max(.4,z+ +zz.dataset.z*.25));draw()}};
  await draw();
}
let pvTok=null;
async function preview(){
  const box=$('#pvbox');if(!box||!res)return;const tok=pvTok=Symbol(),{blob,name}=res,ext=name.split('.').pop().toLowerCase();
  const blobOf=async(z,n,t)=>new Blob([await z.files[n].async('arraybuffer')],{type:t});
  try{
    if(ext=='pdf')await pdfViewer(box,blob);
    else if(ext=='jpg'||ext=='png')box.innerHTML=`<img class="pimg" alt="" src="${URL.createObjectURL(blob)}">`;
    else if(ext=='txt'){const t=await blob.text();box.innerHTML=`<pre class="ptxt">${esc(t.slice(0,5000))}${t.length>5000?'\n…':''}</pre>`}
    else if(ext=='zip'){
      const z=await JSZip.loadAsync(blob),names=Object.keys(z.files).filter(n=>!z.files[n].dir).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      if(tok!=pvTok)return;
      if(/\.pdf$/i.test(names[0]||'')){
        box.innerHTML=`<div class="ptabs">${names.slice(0,30).map((n,i)=>`<button class="mini" data-t="${i}" title="${esc(n)}" aria-pressed="${i==0}">${i+1}</button>`).join('')}</div><div id="pvin"></div>`;
        const open=async i=>{box.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t==i));await pdfViewer($('#pvin'),await blobOf(z,names[i],PDFT))};
        box.querySelector('.ptabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)open(+b.dataset.t).catch(()=>{})};
        await open(0);
      }else{
        const shown=names.slice(0,12),urls=await Promise.all(shown.map(async n=>URL.createObjectURL(await blobOf(z,n,/png$/i.test(n)?'image/png':'image/jpeg'))));
        box.innerHTML=`<div class="pgrid">${urls.map(u=>`<img alt="" src="${u}">`).join('')}</div>${names.length>12?`<p class="hint" style="margin-top:8px">+${names.length-12} ${L(['gambar lain di dalam zip','more images in the zip'])}</p>`:''}`;
      }
    }
  }catch(e){console.error(e);box.innerHTML=`<p class="hint">${L(['Pratinjau tidak tersedia, tapi file tetap bisa diunduh.','Preview unavailable, but the file can still be downloaded.'])}</p>`}
}
function drawResult(){
  const{name,blob,note,before}=res;let cmp='',msg=`${esc(name)} · ${fmt(blob.size)}`;
  if(tool.id=='compress'){
    const pct=Math.max(0,Math.round((1-blob.size/before)*100));
    msg=pct?L([`Ukuran turun ${pct}%.`,`Size reduced by ${pct}%.`]):L(['File ini sudah sangat efisien, tidak bisa dikecilkan lagi.','This file is already efficient and cannot be shrunk further.']);
    cmp=`<div class="cmp"><div><span>${L(['Sebelum','Before'])}</span><b>${fmt(before)}</b></div><div class="t"><s style="width:100%"></s></div><div><span>${L(['Sesudah','After'])}</span><b>${fmt(blob.size)}</b></div><div class="t n"><s style="width:${Math.max(3,blob.size/before*100)}%"></s></div></div>`;
  }
  if(note)msg=L(note)+'<br>'+msg;
  $('#body').innerHTML=`<div class="res"><div class="rtop"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="rtx"><h3>${L(['Selesai','Done'])}</h3><p>${msg}</p></div><button class="dl" id="dl">${L(['Unduh hasil','Download'])}</button></div>${cmp}
    <div class="pvh">${L(['Pratinjau sebelum diunduh','Preview before you download'])}</div><div class="pvbox" id="pvbox"><p class="hint">${L(['Memuat pratinjau…','Loading preview…'])}</p></div>
    <button class="again" id="again">${L(['Proses file lain','Process another file'])}</button></div>`;
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  $('#again').onclick=()=>{res=null;pvTok=null;files=[];STUDIO=[];renderTool()};
  updGo();preview();
}

applyTheme();applyLang();route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
